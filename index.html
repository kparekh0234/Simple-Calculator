<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern calculator with calculation history, keyboard support, and dark and light themes.">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="app">
        <div class="dashboard">

            <!-- HISTORY PANEL - LEFT SIDE -->
            <section class="history-panel">
                <div class="history-header">
                    <div>
                        <p class="eyebrow">YOUR ACTIVITY</p>
                        <h2>History</h2>
                    </div>

                    <button
                        id="clearHistory"
                        class="clear-history"
                        type="button"
                        aria-label="Clear calculation history"
                    >
                        Clear
                    </button>
                </div>

                <div
                    id="historyList"
                    class="history-list"
                    aria-live="polite"
                >
                    <p class="empty-history">Your calculations will appear here.</p>
                </div>
            </section>


            <!-- CALCULATOR PANEL - RIGHT SIDE -->
            <section class="calculator">

                <div class="calculator-header">
                    <div class="brand">
                        <p class="eyebrow">PRECISION AT YOUR FINGERTIPS</p>
                        <h1>Calculator</h1>
                    </div>

                    <button
                        id="themeToggle"
                        class="theme-toggle"
                        type="button"
                        aria-label="Switch color theme"
                        title="Toggle light and dark theme"
                    >
                        ☀
                    </button>
                </div>


                <!-- DISPLAY -->
                <div class="display-container">
                    <div
                        id="expression"
                        class="expression"
                        aria-live="polite"
                    ></div>

                    <div
                        id="display"
                        class="display"
                        role="status"
                        aria-live="polite"
                    >
                        0
                    </div>
                </div>


                <!-- CALCULATOR BUTTONS -->
                <div class="grid">

                    <button class="btn control" data-action="clear" type="button">
                        AC
                    </button>

                    <button class="btn control" data-action="back" type="button" aria-label="Backspace">
                        DEL
                    </button>

                    <button class="btn operator" data-value="%" type="button">
                        %
                    </button>

                    <button class="btn operator" data-value="/" type="button">
                        ÷
                    </button>


                    <button class="btn" data-value="7" type="button">7</button>
                    <button class="btn" data-value="8" type="button">8</button>
                    <button class="btn" data-value="9" type="button">9</button>
                    <button class="btn operator" data-value="*" type="button">×</button>


                    <button class="btn" data-value="4" type="button">4</button>
                    <button class="btn" data-value="5" type="button">5</button>
                    <button class="btn" data-value="6" type="button">6</button>
                    <button class="btn operator" data-value="-" type="button">−</button>


                    <button class="btn" data-value="1" type="button">1</button>
                    <button class="btn" data-value="2" type="button">2</button>
                    <button class="btn" data-value="3" type="button">3</button>
                    <button class="btn operator" data-value="+" type="button">+</button>


                    <button class="btn" data-value="(" type="button">(</button>
                    <button class="btn" data-value="0" type="button">0</button>
                    <button class="btn" data-value="." type="button">.</button>
                    <button class="btn equals" data-action="equals" type="button">=</button>

                </div>

                <p class="keyboard-hint">
                    You can also use your keyboard to calculate.
                </p>

            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
